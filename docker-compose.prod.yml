services:
  # nginx è pubblicato su HTTP_BIND:HTTP_PORT (.env), di default solo su
  # 127.0.0.1:8080: non raggiungibile dalla rete, ma solo da un reverse proxy
  # sulla stessa macchina che termina il TLS e assegna l'indirizzo web (es.
  # "tailscale serve", Caddy, Traefik). Vedi README, sezione "Self-hosting".
  nginx:
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"

  php:
    restart: unless-stopped

  db:
    restart: unless-stopped
