name: SLSA generic generator - CommSuite Release
on:
  push:
    tags:
      - 'v*'
  # Da avviare selezionando un tag (non un branch) come ref
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
      release_body: ${{ steps.extract_release_notes.outputs.release_body }}
      archive_path: ${{ env.ARCHIVE_PATH }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # SismaFramework è un submodule (www/SismaFramework): senza, l'archivio
          # non conterrebbe il framework
          submodules: recursive
      - name: Verify tag and version
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "ERROR: il rilascio va avviato da un tag v*, non da ${{ github.ref_name }}"
            exit 1
          fi
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          COMPOSER_VERSION=$(jq -r '.version' www/composer.json)
          if [ "$VERSION" != "$COMPOSER_VERSION" ]; then
            echo "ERROR: il tag $TAG_NAME non corrisponde alla versione $COMPOSER_VERSION di www/composer.json"
            exit 1
          fi
          if ! grep -qF "## [${VERSION}]" CHANGELOG.md; then
            echo "ERROR: nessuna voce [${VERSION}] nel CHANGELOG.md"
            exit 1
          fi
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysqli, pdo_mysql, zip, gd, mbstring, dom, xml
          tools: composer
      - name: Install dependencies
        # vendor/ non è versionato: l'archivio deve contenere le dipendenze
        # di produzione per essere eseguibile
        run: composer install --working-dir=www --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - name: Create release archive
        id: create_archive
        run: |
          set -euo pipefail
          TAG_NAME="${{ github.ref_name }}"
          ZIP_NAME="${{ github.event.repository.name }}-${TAG_NAME}.zip"

          zip -r "$ZIP_NAME" . \
            --exclude="*.git*" \
            --exclude=".claude/*" \
            --exclude="nbproject/*" \
            --exclude="backups/*" \
            --exclude="rclone/*" \
            --exclude=".env" \
            --exclude="www/Cache/*" \
            --exclude="www/Logs/*" \
            --exclude="www/filesystemMedia/*" \
            --exclude="www/SismaFramework/Tests/*" \
            --exclude="www/SismaFramework/TestsApplication/*" \
            --exclude="www/SismaFramework/docs-phpdoc/*" \
            --exclude="www/SismaFramework/phpunit.xml" \
            --exclude="www/SismaFramework/phpdoc.xml" \
            --exclude="www/SismaFramework/CONTRIBUTING.md" \
            --exclude="www/SismaFramework/SECURITY.md"

          echo "ARCHIVE_PATH=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "zip_file_name=$ZIP_NAME" >> "${GITHUB_OUTPUT}"

      - name: Upload archive as artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-archive
          path: ${{ env.ARCHIVE_PATH }}
      - name: Extract Release Notes
        id: extract_release_notes
        run: |
          set -euo pipefail
          TAG_NAME="${{ github.ref_name }}"
          RELEASE_VERSION="${TAG_NAME#v}"
          # Dalla voce della versione fino alla successiva (o al separatore ---)
          RELEASE_NOTES=$(awk -v head="## [${RELEASE_VERSION}]" '
            index($0, head) == 1 { flag = 1; next }
            /^## \[/ || /^---$/ { flag = 0 }
            flag' CHANGELOG.md)

          DELIMITER="EOF_$(openssl rand -hex 8)"
          {
            echo "release_body<<${DELIMITER}"
            echo "$RELEASE_NOTES"
            echo "${DELIMITER}"
          } >> "${GITHUB_OUTPUT}"
      - name: Verify archive exists
        run: |
          if [ ! -f "${{ env.ARCHIVE_PATH }}" ]; then
            echo "ERROR: archive not found at ${{ env.ARCHIVE_PATH }}"
            exit 1
          fi
          ls -lh "${{ env.ARCHIVE_PATH }}"
      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail
          ZIP_FILE="${{ env.ARCHIVE_PATH }}"
          echo "digests=$(sha256sum "$ZIP_FILE" | base64 -w0)" >> "${GITHUB_OUTPUT}"


  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      # La repository è privata: senza questo flag il generatore si ferma.
      # La provenance è firmata con Sigstore e registrata nel log pubblico
      # Rekor, che rende visibili nome della repository, workflow, commit e
      # tag (non il codice né l'archivio).
      private-repository: true

  upload-attestation:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archive
        uses: actions/download-artifact@v8
        with:
          name: release-archive
          path: .

      - name: Download attestation
        uses: actions/download-artifact@v8
        with:
          pattern: "*.intoto.jsonl"
          merge-multiple: true
          path: .

      - name: List downloaded files (debug)
        run: |
          echo "All files in current directory:"
          ls -la .

      - name: Create GitHub Release with attestation
        uses: softprops/action-gh-release@v3
        env:
          RELEASE_BODY: ${{ needs.build.outputs.release_body }}
        with:
          tag_name: ${{ github.ref_name }}
          name: CommSuite ${{ github.ref_name }}
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ needs.build.outputs.archive_path }}
            *.intoto.jsonl
