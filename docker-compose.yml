services:
  # --- NGINX WEB SERVER ---
  nginx:
    image: nginx:alpine
    # CONTAINER_PREFIX (.env) permette di avviare una seconda istanza dello
    # stesso progetto sulla stessa macchina (es. produzione in un'altra
    # cartella) senza conflitti sui nomi dei container.
    container_name: ${CONTAINER_PREFIX:-comm_suite}_nginx
    volumes:
      - ./www:/var/www/html/
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template
    environment:
      # Allineato a POST_MAX_SIZE (.env), vedi nginx.conf.template. L'immagine
      # nginx:alpine renderizza automaticamente i file in /etc/nginx/templates/
      # sostituendo le variabili d'ambiente presenti nel container.
      POST_MAX_SIZE: ${POST_MAX_SIZE:-12M}
    depends_on:
      - php
    networks:
      - default

  # --- PHP-FPM ---
  php:
    # Senza target viene costruito l'ultimo stage del Dockerfile ("prod");
    # docker-compose.dev.yml seleziona "dev" (Xdebug, pcov).
    build:
      context: .
    container_name: ${CONTAINER_PREFIX:-comm_suite}_php
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./www:/var/www/html/
    env_file:
      - .env
    networks:
      - default

  # --- DATABASE ---
  db:
    # Versione fissata: con "latest" un pull potrebbe portare a una major
    # successiva e aggiornare i dati del volume senza possibilità di tornare
    # indietro (MariaDB non supporta il downgrade). Aggiornare a mano, dopo un
    # backup; MARIADB_AUTO_UPGRADE aggiorna le tabelle di sistema all'avvio.
    image: mariadb:12.2
    container_name: ${CONTAINER_PREFIX:-comm_suite}_db
    profiles:
      - internal-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DATABASE_NAME}
      MARIADB_USER: ${DATABASE_USERNAME}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
      - ./comm_suite.sql:/docker-entrypoint-initdb.d/comm_suite.sql
    networks:
      - default

networks:
  web_network:
    external: true

volumes:
  db_data:
